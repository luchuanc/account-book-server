[supervisord]
nodaemon=true
logfile=/var/log/account-book/supervisord.log
pidfile=/var/run/supervisord.pid

[program:postgresql]
command=/bin/bash -lc "/usr/lib/postgresql/*/bin/postgres -D /var/lib/postgresql/data"
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/account-book/postgresql.out.log
stderr_logfile=/var/log/account-book/postgresql.err.log

[program:redis]
command=/usr/bin/redis-server /deploy/redis/redis.conf
autostart=true
autorestart=true
priority=20
stdout_logfile=/var/log/account-book/redis.out.log
stderr_logfile=/var/log/account-book/redis.err.log

[program:api]
command=/bin/bash -lc "cd /app && npm start"
autostart=true
autorestart=true
priority=30
stdout_logfile=/var/log/account-book/api.out.log
stderr_logfile=/var/log/account-book/api.err.log

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=40
stdout_logfile=/var/log/account-book/nginx.out.log
stderr_logfile=/var/log/account-book/nginx.err.log

[program:cron]
command=/usr/sbin/cron -f
autostart=true
autorestart=true
priority=50
stdout_logfile=/var/log/account-book/cron.out.log
stderr_logfile=/var/log/account-book/cron.err.log
